<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="The Illustration Atelier">
  <title>The Illustration Atelier — wordmark</title>
  <desc>Horizontal lock-up: folded A icon paired with the wordmark.</desc>

  <!-- Optional warm paper background — remove the rect if you want it transparent -->
  <rect width="800" height="220" fill="#f4efe6"/>

  <!-- Icon at left -->
  <g transform="translate(40, 30)">
    <rect width="160" height="160" rx="30" fill="#161310"/>
    <rect x="9" y="9" width="142" height="142" rx="24" fill="none" stroke="#f4efe6" stroke-width="0.6" opacity="0.18"/>
    <g transform="translate(80, 80)">
      <polygon points="0,-44 40,44 -2,44" fill="#f4efe6"/>
      <polygon points="0,-44 -40,44 -2,44" fill="#d6451e"/>
      <line x1="0" y1="-44" x2="-2" y2="44" stroke="#161310" stroke-width="0.7" opacity="0.55"/>
      <rect x="-18" y="6" width="36" height="4.5" fill="#161310" opacity="0.9"/>
    </g>
    <circle cx="135" cy="135" r="3" fill="#d6451e"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(232, 0)">
    <!-- Tiny eyebrow -->
    <text x="0" y="60" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3.5" fill="#d6451e">EST · MMXXVI</text>
    <!-- Main wordmark, two lines -->
    <text x="0" y="115" font-family="'Fraunces', Georgia, serif" font-size="56" font-weight="500" fill="#161310" letter-spacing="-1.2">The Illustration</text>
    <text x="0" y="172" font-family="'Fraunces', Georgia, serif" font-size="56" font-style="italic" font-weight="400" fill="#161310" letter-spacing="-0.5">Atelier<tspan fill="#d6451e">.</tspan></text>
    <!-- Hairline rule -->
    <line x1="0" y1="190" x2="380" y2="190" stroke="#161310" stroke-width="0.6" opacity="0.4"/>
    <!-- Tagline -->
    <text x="0" y="205" font-family="'Newsreader', Georgia, serif" font-size="13" font-style="italic" fill="#8a9079">a small press for synthetic pictures</text>
  </g>
</svg>
